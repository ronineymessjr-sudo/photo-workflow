<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摄影方案 · Photo Atelier</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0c0c0e;
            color: #fafafa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-box {
            background: #141416;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .brand {
            margin-bottom: 30px;
        }
        .brand h1 {
            font-family: Georgia, serif;
            font-size: 2.5rem;
            font-weight: 600;
        }
        .brand span {
            color: #ff6b6b;
            font-style: italic;
        }
        .brand p {
            color: rgba(255,255,255,0.55);
            margin-top: 8px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.3);
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #1c1c1f;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            color: #fafafa;
            font-size: 1rem;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8585 100%);
            border: none;
            border-radius: 16px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
        .app-container {
            display: none;
            flex: 1;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 260px;
            background: linear-gradient(180deg, rgba(16,16,18,0.95) 0%, rgba(12,12,14,0.98) 100%);
            border-right: 1px solid rgba(255,255,255,0.06);
            padding: 24px 16px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 16px;
            cursor: pointer;
            color: rgba(255,255,255,0.55);
            margin-bottom: 4px;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.04);
            color: #fafafa;
        }
        .main-content {
            margin-left: 260px;
            padding: 32px;
        }
        .panel {
            background: linear-gradient(145deg, rgba(20,20,22,0.8) 0%, rgba(16,16,18,0.6) 100%);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .panel h2 {
            font-size: 1.1rem;
            margin-bottom: 16px;
        }
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                top: auto;
                width: 100%;
                height: 60px;
                flex-direction: row;
                display: flex;
                padding: 8px;
            }
            .main-content {
                margin-left: 0;
                margin-bottom: 60px;
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">
        <div class="login-box">
            <div class="brand">
                <h1>Photo<span>Atelier</span></h1>
                <p>摄影方案 · 智能工作流</p>
            </div>
            <div id="loginForm">
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="email" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="输入密码">
                </div>
                <button class="btn" onclick="login()">登录 / 注册</button>
                <p style="margin-top: 16px; font-size: 0.75rem; color: rgba(255,255,255,0.3);">首次登录自动注册账号</p>
            </div>
        </div>
    </div>

    <!-- App Screen -->
    <div id="appScreen" class="app-container">
        <div class="sidebar">
            <div class="nav-item active" onclick="showTab('schedule')">📅 日程日历</div>
            <div class="nav-item" onclick="showTab('equipment')">📷 设备库</div>
            <div class="nav-item" onclick="showTab('venue')">📍 场地库</div>
            <div class="nav-item" onclick="showTab('model')">👤 模特库</div>
            <div class="nav-item" onclick="showTab('plan')">📝 方案生成</div>
        </div>
        <div class="main-content">
            <div id="scheduleTab" class="tab-content">
                <div class="panel">
                    <h2>📅 日程日历</h2>
                    <p>功能开发中...</p>
                </div>
            </div>
            <div id="equipmentTab" class="tab-content" style="display:none">
                <div class="panel">
                    <h2>📷 设备库</h2>
                    <p>功能开发中...</p>
                </div>
            </div>
            <div id="venueTab" class="tab-content" style="display:none">
                <div class="panel">
                    <h2>📍 场地库</h2>
                    <p>功能开发中...</p>
                </div>
            </div>
            <div id="modelTab" class="tab-content" style="display:none">
                <div class="panel">
                    <h2>👤 模特库</h2>
                    <p>功能开发中...</p>
                </div>
            </div>
            <div id="planTab" class="tab-content" style="display:none">
                <div class="panel">
                    <h2>📝 方案生成</h2>
                    <p>功能开发中...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 兼容所有浏览器的代码
        var API_BASE = 'https://photo-workflow.vercel.app/api';
        
        function login() {
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;
            
            if (!email || !password) {
                alert('请输入邮箱和密码');
                return;
            }
            
            // 调用登录API
            fetch(API_BASE + '/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.success) {
                    try {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                    } catch(e) {}
                    showApp();
                } else {
                    alert(data.error || '登录失败');
                }
            })
            .catch(function(e) {
                alert('网络错误: ' + e.message);
            });
        }
        
        function showApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'flex';
        }
        
        function showTab(tabName) {
            var tabs = ['schedule', 'equipment', 'venue', 'model', 'plan'];
            for (var i = 0; i < tabs.length; i++) {
                var tab = document.getElementById(tabs[i] + 'Tab');
                if (tab) tab.style.display = 'none';
            }
            var activeTab = document.getElementById(tabName + 'Tab');
            if (activeTab) activeTab.style.display = 'block';
        }
        
        // 检查是否已登录
        function checkAuth() {
            var token = null;
            try {
                token = localStorage.getItem('token');
            } catch(e) {}
            
            if (token) {
                showApp();
            }
        }
        
        // 页面加载时检查
        checkAuth();
    </script>
</body>
</html>
