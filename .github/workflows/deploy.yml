name: Validate and Deploy PhotoAtelier V2

on:
  push:
    branches: [main, master, release/photoatelier-v3]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'src/**'
      - 'worker/**'
      - 'tests/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'src/**'
      - 'worker/**'
      - 'tests/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: V2 quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Node and smoke tests
        run: npm test

      - name: Build V2 distribution
        run: npm run build:v2

      - name: Validate distribution contents
        run: npm run test:dist

      - name: Run compatibility workspace browser test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:legacy

      - name: Upload validated distribution
        uses: actions/upload-artifact@v4
        with:
          name: photoatelier-v2-dist
          path: dist-v2
          if-no-files-found: error

  deploy-pages:
    name: Deploy canonical V2 pages
    needs: quality
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release/photoatelier-v3')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build:v2
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          wrangler pages deploy dist-v2 --project-name=photoatelier

  deploy-worker:
    name: Deploy V2 Worker
    needs: quality
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release/photoatelier-v3')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          wrangler deploy --config worker/wrangler.toml

      - name: Verify Worker health when URL is configured
        env:
          PHOTOATELIER_WORKER_URL: ${{ vars.PHOTOATELIER_WORKER_URL }}
        run: |
          if [ -n "$PHOTOATELIER_WORKER_URL" ]; then
            curl --fail --retry 5 --retry-delay 3 "${PHOTOATELIER_WORKER_URL%/}/api/health"
          else
            echo "PHOTOATELIER_WORKER_URL is not configured; skipping remote health check."
          fi
