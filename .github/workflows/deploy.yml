name: Deploy Backend

on:
  push:
    branches: [main, master]
    paths:
      - 'api/**'
      - 'tests/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Verify shared workspace and existing API contracts
        run: node --test tests/*.test.mjs

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          # 先部署最新代码（避免存在未部署版本时 secret put 报错），再确保密钥同步
          wrangler deploy --name photoatelier-api

          # 设置密钥
          echo "$JWT_SECRET" | wrangler secret put JWT_SECRET --name photoatelier-api
          echo "$SUPABASE_URL" | wrangler secret put SUPABASE_URL --name photoatelier-api
          echo "$SUPABASE_ANON_KEY" | wrangler secret put SUPABASE_ANON_KEY --name photoatelier-api
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Missing server-only SUPABASE_SERVICE_KEY"
            exit 1
          fi
          echo "$SUPABASE_SERVICE_KEY" | wrangler secret put SUPABASE_SERVICE_KEY --name photoatelier-api
          if [ -n "$MINIMAX_API_KEY" ]; then
            echo "$MINIMAX_API_KEY" | wrangler secret put MINIMAX_API_KEY --name photoatelier-api
          fi

      - name: Verify Deployment
        run: |
          sleep 5
          curl --fail --silent --show-error https://photoatelier-api.photomagic.workers.dev/api/health
