name = "photoatelier-api"
main = "api/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "eaab0ca2aac12cd19b8a697a508da342"

# 环境变量（生产环境在 Cloudflare Dashboard 中设置）
[vars]
ENVIRONMENT = "production"

# 密钥（通过 wrangler secret 设置，不要在这里写真实值）
# JWT_SECRET
# SUPABASE_URL
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_KEY (server-only; never included in static assets)
# MINIMAX_API_KEY

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "WORKSPACE_SYNC"
class_name = "WorkspaceSync"

[[migrations]]
tag = "workspace-sync-v1"
new_sqlite_classes = ["WorkspaceSync"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = false
