name = "photoatelier-api"
main = "api/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "eaab0ca2aac12cd19b8a697a508da342"

# 环境变量（生产环境在 Cloudflare Dashboard 中设置）
[vars]
ENVIRONMENT = "production"
RESEND_AUTH_ENABLED = "true"
# Initial release image limits: ten per account and fifty site-wide per day.
STUDIO_IMAGE_USER_LIMIT = "50"
STUDIO_IMAGE_GLOBAL_LIMIT = "50"
AI_STUDIO_ALLOWED_ORIGINS = "https://photo-workflow.pages.dev,https://photo.ronineymessjrstudio.cn,https://fix-multi-pose-library-gener.photo-workflow.pages.dev,https://ronineymessjr-sudo.github.io"

# 密钥（通过 wrangler secret 设置，不要在这里写真实值）
# JWT_SECRET
# SUPABASE_URL
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_KEY (server-only; never included in static assets)
# MINIMAX_API_KEY

[ai]
binding = "AI"

# Reference images for continuity groups.
# KV is the pragmatic choice: R2 needs its own dashboard activation (billing
# details) before `wrangler r2 bucket create` works, while KV is available
# immediately and the free tier (1GB, 100k reads/day) covers reference stills.
# Values are base64, capped at 8MB per asset by the app; KV's limit is 25MB.
# Swap to R2 (binding CONTINUITY_ASSETS) once it is enabled - the app prefers R2
# automatically when that binding exists.
[[kv_namespaces]]
binding = "CONTINUITY_KV"
id = "0ad84e60521a4089825a0e81f19a2d50"

[[durable_objects.bindings]]
name = "WORKSPACE_SYNC"
class_name = "WorkspaceSync"

[[migrations]]
tag = "workspace-sync-v1"
new_sqlite_classes = ["WorkspaceSync"]

[[durable_objects.bindings]]
name = "AI_STUDIO_QUOTA"
class_name = "AiStudioQuota"

[[migrations]]
tag = "ai-studio-quota-v1"
new_sqlite_classes = ["AiStudioQuota"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = false
