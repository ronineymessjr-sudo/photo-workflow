name = "photoatelier-api"
main = "api/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 环境变量（生产环境在 Cloudflare Dashboard 中设置）
[vars]
ENVIRONMENT = "production"

# 密钥（通过 wrangler secret 设置，不要在这里写真实值）
# JWT_SECRET
# SUPABASE_URL
# SUPABASE_ANON_KEY
# MINIMAX_API_KEY
