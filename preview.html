<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoAtelier - 主应用预览</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0c0c0e;
            --bg2: #141416;
            --bg3: #1c1c1f;
            --bg4: #252528;
            --bd: rgba(255,255,255,0.06);
            --bd2: rgba(255,255,255,0.12);
            --t1: #fafafa;
            --t2: rgba(255,255,255,0.55);
            --t3: rgba(255,255,255,0.3);
            --ac: #ff6b6b;
            --ac2: #4ecdc4;
            --radius: 24px;
            --radius-sm: 16px;
            --sidebar-w: 260px;
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-sans: 'Inter', -apple-system, sans-serif;
        }
        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--t1);
            min-height: 100vh;
            display: flex;
        }
        /* Sidebar */
        .sidebar {
            width: var(--sidebar-w);
            height: 100vh;
            background: linear-gradient(180deg, rgba(16,16,18,0.95) 0%, rgba(12,12,14,0.98) 100%);
            border-right: 1px solid var(--bd);
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0;
            top: 0;
        }
        .sidebar-brand {
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid var(--bd);
        }
        .brand-dot {
            width: 10px;
            height: 10px;
            background: var(--ac);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(255,107,107,0.5);
        }
        .brand-text {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .brand-text span { color: var(--ac); }
        .sidebar-nav {
            flex: 1;
            padding: 1rem 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.85rem 1rem;
            background: transparent;
            border: none;
            border-radius: 12px;
            color: var(--t2);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            font-size: 0.9rem;
            text-align: left;
            width: 100%;
        }
        .nav-item:hover {
            background: rgba(255,255,255,0.04);
            color: var(--t1);
        }
        .nav-item.active {
            background: rgba(255,107,107,0.1);
            color: var(--ac);
        }
        .nav-item svg {
            width: 20px;
            height: 20px;
            stroke-width: 1.8;
        }
        .nav-badge {
            margin-left: auto;
            background: var(--ac);
            color: white;
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            font-weight: 500;
        }
        .sidebar-footer {
            padding: 1rem;
            border-top: 1px solid var(--bd);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: var(--bg3);
            border-radius: 12px;
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--ac), var(--ac2));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .user-name {
            font-size: 0.85rem;
            font-weight: 500;
        }
        .user-role {
            font-size: 0.75rem;
            color: var(--t3);
        }
        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-w);
            padding: 2rem;
            min-height: 100vh;
        }
        .page-header {
            margin-bottom: 2rem;
        }
        .page-title {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }
        .page-subtitle {
            color: var(--t2);
            font-size: 0.95rem;
        }
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--bg2);
            border: 1px solid var(--bd);
            border-radius: var(--radius-sm);
            padding: 1.5rem;
            transition: all 0.3s;
        }
        .stat-card:hover {
            border-color: var(--bd2);
            transform: translateY(-2px);
        }
        .stat-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,107,107,0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            color: var(--ac);
        }
        .stat-value {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .stat-label {
            color: var(--t3);
            font-size: 0.85rem;
        }
        .stat-trend {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }
        .stat-trend.up { color: #22c55e; }
        .stat-trend.down { color: #ef4444; }
        /* Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
        }
        .card {
            background: var(--bg2);
            border: 1px solid var(--bd);
            border-radius: var(--radius-sm);
            padding: 1.5rem;
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }
        .card-title {
            font-size: 1rem;
            font-weight: 500;
        }
        /* Schedule List */
        .schedule-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--bg3);
            border-radius: 12px;
            margin-bottom: 0.75rem;
            transition: all 0.2s;
        }
        .schedule-item:hover {
            background: var(--bg4);
        }
        .schedule-date {
            text-align: center;
            min-width: 50px;
        }
        .schedule-day {
            font-size: 1.25rem;
            font-weight: 600;
        }
        .schedule-month {
            font-size: 0.75rem;
            color: var(--t3);
            text-transform: uppercase;
        }
        .schedule-info {
            flex: 1;
        }
        .schedule-title {
            font-weight: 500;
            margin-bottom: 0.25rem;
        }
        .schedule-meta {
            font-size: 0.8rem;
            color: var(--t3);
        }
        .schedule-status {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .status-upcoming {
            background: rgba(255,107,107,0.15);
            color: var(--ac);
        }
        .status-completed {
            background: rgba(34,197,94,0.15);
            color: #22c55e;
        }
        /* Quick Actions */
        .quick-actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .action-btn {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--bg3);
            border: 1px solid var(--bd);
            border-radius: 12px;
            color: var(--t1);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            font-size: 0.9rem;
            text-align: left;
        }
        .action-btn:hover {
            border-color: var(--ac);
            background: rgba(255,107,107,0.05);
        }
        .action-btn svg {
            width: 18px;
            height: 18px;
            color: var(--ac);
        }
        /* Theme Badge */
        .theme-badge {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: var(--bg3);
            border: 1px solid var(--bd);
            border-radius: 20px;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 100;
        }
        .theme-dot {
            width: 8px;
            height: 8px;
            background: var(--ac);
            border-radius: 50%;
        }
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .stat-card, .card, .schedule-item {
            animation: fadeIn 0.5s ease-out forwards;
        }
        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.2s; }
        .stat-card:nth-child(3) { animation-delay: 0.3s; }
        .stat-card:nth-child(4) { animation-delay: 0.4s; }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <span class="brand-dot"></span>
            <span class="brand-text">Photo<span>Atelier</span></span>
        </div>
        <nav class="sidebar-nav">
            <button class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                <span>方案生成</span>
            </button>
            <button class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
                <span>方案库</span>
                <span class="nav-badge">3</span>
            </button>
            <button class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span>日程管理</span>
            </button>
            <button class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
                <span>资源库</span>
            </button>
            <button class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                <span>数据看板</span>
            </button>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">P</div>
                <div>
                    <div class="user-name">摄影师小王</div>
                    <div class="user-role">摄影师</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="theme-badge">
            <span class="theme-dot"></span>
            <span>Dark Mode</span>
        </div>
        
        <div class="page-header">
            <h1 class="page-title">数据看板</h1>
            <p class="page-subtitle">本月拍摄数据概览</p>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                </div>
                <div class="stat-value">12</div>
                <div class="stat-label">本月拍摄场次</div>
                <div class="stat-trend up">↑ 20% vs 上月</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                </div>
                <div class="stat-value">85%</div>
                <div class="stat-label">完成率</div>
                <div class="stat-trend up">↑ 5% vs 上月</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                </div>
                <div class="stat-value">8</div>
                <div class="stat-label">常用场地</div>
                <div class="stat-trend down">↓ 2 vs 上月</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
                <div class="stat-value">15</div>
                <div class="stat-label">合作模特</div>
                <div class="stat-trend up">↑ 3 vs 上月</div>
            </div>
        </div>

        <!-- Content Grid -->
        <div class="content-grid">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">近期日程</h3>
                    <span style="color: var(--ac); font-size: 0.85rem; cursor: pointer;">查看全部 →</span>
                </div>
                <div class="schedule-item">
                    <div class="schedule-date">
                        <div class="schedule-day">18</div>
                        <div class="schedule-month">5月</div>
                    </div>
                    <div class="schedule-info">
                        <div class="schedule-title">人像写真拍摄 - 小美</div>
                        <div class="schedule-meta">📍 朝阳公园 · ⏰ 14:00-18:00</div>
                    </div>
                    <span class="schedule-status status-upcoming">即将开始</span>
                </div>
                <div class="schedule-item">
                    <div class="schedule-date">
                        <div class="schedule-day">20</div>
                        <div class="schedule-month">5月</div>
                    </div>
                    <div class="schedule-info">
                        <div class="schedule-title">商业产品拍摄 - 某品牌</div>
                        <div class="schedule-meta">📍 工作室 · ⏰ 10:00-17:00</div>
                    </div>
                    <span class="schedule-status status-upcoming">待确认</span>
                </div>
                <div class="schedule-item">
                    <div class="schedule-date">
                        <div class="schedule-day">15</div>
                        <div class="schedule-month">5月</div>
                    </div>
                    <div class="schedule-info">
                        <div class="schedule-title">婚纱照拍摄 - 李先生&王小姐</div>
                        <div class="schedule-meta">📍 故宫 · ⏰ 08:00-12:00</div>
                    </div>
                    <span class="schedule-status status-completed">已完成</span>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">快捷操作</h3>
                </div>
                <div class="quick-actions">
                    <button class="action-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                        新建拍摄方案
                    </button>
                    <button class="action-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        添加日程
                    </button>
                    <button class="action-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                        添加场地
                    </button>
                    <button class="action-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        添加模特
                    </button>
                    <button class="action-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        同步到飞书
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
